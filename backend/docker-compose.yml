services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    restart: always
    environment:
      TZ: America/Argentina/Buenos_Aires
      PGTZ: America/Argentina/Buenos_Aires
      POSTGRES_DB: proyecto_materias
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data-materias:/var/lib/postgresql/data

volumes:
  postgres_data-materias:
